appId: com.codexstyle.desktop
productName: CodexStyle
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: native/secure-store/build/Release/secure_store.node
    to: native/secure_store.node
  - from: resources/icon.png
    to: icon.png
  - from: resources/tray-icon.png
    to: tray-icon.png
  - from: resources/tray-icon@2x.png
    to: tray-icon@2x.png
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: CodexStyle-${version}-${arch}.${ext}
nsis:
  include: resources/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CodexStyle
  runAfterFinish: true
publish:
  provider: generic
  url: https://github.com/Zhqiankun/codexDream/releases/latest/download/
  channel: latest
  useMultipleRangeRequest: false
